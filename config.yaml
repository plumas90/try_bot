# Frequently tuned parameters — edit here instead of the launch command.
# CLI overrides still work: ros2 launch ... confidence_threshold:=0.5
# ROS2 ParameterFile format required: values must be under ros__parameters

/**:
  ros__parameters:
    # Mission
    target_class: laptop

    # YOLO
    confidence_threshold: 0.30
    confidence_threshold_track: 0.15
    process_every_n_frames: 5

    # Movement
    linear_speed: 0.18
    stop_distance: 0.55
    obstacle_stop_distance: 0.35
    paper_center_deadband: 0.45
    paper_angular_gain: 0.12
    paper_stop_area_ratio: 0.020

    # OCR
    ocr_timeout_sec: 15.0
    ocr_interval_sec: 2.0
